# Disaster Damage Assessment — Configuration

dataset:
  name: "xBD"
  source: "xView2 official xBD dataset multi-tier structure"
  labeled_subdirs:
    - "tier1"
    - "tier3"
    - "hold"
    - "test"
  damage_classes:
    0: "no-damage"
    1: "minor-damage"
    2: "major-damage"
    3: "destroyed"
  un_classified: "un-classified"

preprocessing:
  crop_size: [128, 128] # Resized building crop dimension (H, W)
  padding: 10          # Pixel padding around building bounding box
  min_crop_size: 10    # Minimum height/width to consider a valid building polygon
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

input:
  image_size: [128, 128]
  channels: 3
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  task: "building_damage_classification"
  architecture: "siamese_resnet50_classifier"
  num_classes: 4
  dropout: 0.3

training:
  batch_size: 8
  epochs: 3
  learning_rate: 0.0001
  num_workers: 0
  save_best_only: true

paths:
  data_dir: "data"
  raw_dir: "data/raw/xBD"
  processed_dir: "data/processed"
  output_dir: "outputs"
  checkpoint_file: "outputs/best_siamese_model.pth"
